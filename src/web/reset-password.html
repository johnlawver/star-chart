<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Star Chart · Choose a new password</title>
  </head>
  <body data-page="reset-password">
    <main>
      <h1>Choose a new password</h1>
      <form id="form">
        <label>Choose a password (at least 8 characters) <input name="password" type="password" minlength="8" autocomplete="new-password" required /></label>
        <button type="submit">Continue</button>
      </form>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./link-pages/main.ts"></script>
  </body>
</html>
