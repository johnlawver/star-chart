services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: star_chart
      POSTGRES_PASSWORD: star_chart_local
      POSTGRES_DB: star_chart
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U star_chart"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Catches every email the app sends in development. Its inbox is at http://127.0.0.1:8025 on this machine.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
